<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>LessonBoard — Контейнеры</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1b16;--mu:#6b665a;--ln:#ddd6c6;--ac:#e4572e;--g:#1f6f5c;--ok:#e2f1ea;--bad:#fbe5df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif}
.mono,code,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.logo{font-weight:700;font-size:22px}.logo b{color:var(--ac)}
.hero{padding:22px 0 8px}
.cells{display:flex;gap:6px;margin-bottom:14px}
.cells span{width:44px;height:44px;border:2px solid var(--ink);display:grid;place-items:center;font:600 16px ui-monospace,Menlo,monospace;background:var(--card)}
.cells span:nth-child(2){background:var(--ac);color:#fff;border-color:var(--ac)}
.cells span:nth-child(4){background:var(--g);color:#fff;border-color:var(--g)}
h1{font-size:clamp(34px,7vw,54px);line-height:1.08;margin:0 0 6px;letter-spacing:-.02em}
.mu{color:var(--mu);font-size:15px}
nav{display:flex;gap:0;margin:18px 0 20px;border-bottom:2px solid var(--ink);overflow-x:auto}
nav button{flex:1;font:600 17px Georgia,serif;padding:12px 18px;border:0;background:none;color:var(--mu);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--ac)}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:26px 0 10px;font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:14px 16px;margin:10px 0}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.t{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--ln)}
.t input{width:24px;height:24px;accent-color:var(--g);flex:none}
.t span{flex:1}.t.d span{text-decoration:line-through;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);font-size:22px;cursor:pointer;padding:4px 10px;border-radius:8px}.x:hover{background:var(--bad);color:var(--ac)}
.add{display:flex;gap:8px;margin-top:14px}
label{display:block;font-weight:700;margin:0 0 4px;font-size:16px}
textarea{width:100%;min-height:80px;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}textarea:focus{outline:2px solid var(--ac)}
input[type=text]{width:100%;flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--ac)}
.btn{font:600 16px Georgia,serif;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.btn.a{background:var(--ac);color:#fff}
details{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;margin:10px 0;padding:0 16px}
summary{cursor:pointer;font-weight:700;padding:14px 0;font-size:19px}
details[open] summary{color:var(--ac)}
details p{margin:0 0 12px}
pre{background:#1d1b16;color:#f2eee2;padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:15px;line-height:1.5;margin:0 0 14px}
.tag{display:inline-block;font:600 13px ui-monospace,Menlo,monospace;background:var(--ok);color:var(--g);padding:2px 9px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:11px 14px;margin:6px 0;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(228,87,46,.2)}
.opt.r{background:var(--ok);border-color:var(--g)}.opt.w{background:var(--bad);border-color:var(--ac)}
.score{font:700 38px ui-monospace,Menlo,monospace;color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 16px Georgia,serif;padding:9px 16px;border:1.5px solid var(--ln);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ac);margin-top:8px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{padding:12px;border-radius:4px 4px 16px 4px;box-shadow:0 4px 10px rgba(0,0,0,.14)}
.note label,.note textarea{color:#2a2616}.note label{font-size:14px}
.note textarea{background:rgba(255,255,255,.55);border:0;min-height:120px}
.ticket{border:2px dashed var(--ac);border-radius:14px;padding:14px 16px;background:var(--card)}
.hid{display:none}
.dz{display:block;margin-top:10px;border:2px dashed var(--ln);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer;font-size:16px}.dz.hov{border-color:var(--ac);background:var(--ok)}.th{height:56px;width:auto;display:inline-block;margin:8px 6px 0 0;border-radius:6px}
figure{margin:10px 0}img{max-width:100%;border-radius:10px;display:block}figcaption{font-size:14px;margin-top:4px}details a,.card a{color:var(--ac)}

const DEF={"v": 0, "topic": "Вставка видео и аудио в документ HTML", "goals": ["Научиться вставлять звук и видео в шаблон web-страницы с помощью тегов audio и video", "Выполнить задания по технике безопасности и проверить знание тегов в LearningApps", "Создать сайт композитора со своими материалами и улучшить его с помощью искусственного интеллекта"], "lec": [{"t": "Зачем нужны audio и video", "b": "Раньше для звука и видео на сайте требовались сторонние плагины. В HTML5 появились теги **audio** и **video**: браузер сам воспроизводит файл и показывает плеер.\n\nОба тега пишутся внутри **body**. Файл с мелодией или роликом должен лежать рядом с HTML-страницей или в её папке."}, {"t": "Тег audio", "b": "Минимальный пример: звук с кнопками управления.\n\n```\n<audio controls src=\"song.mp3\">\n  Ваш браузер не поддерживает аудио.\n</audio>\n```\n\nОсновные атрибуты: **controls** показывает кнопки плеера, **autoplay** запускает звук сразу (браузеры часто блокируют это), **loop** зацикливает, **muted** выключает звук."}, {"t": "Тег video", "b": "Для видео добавляют размеры и обложку.\n\n```\n<video controls width=\"640\" poster=\"cover.jpg\">\n  <source src=\"clip.mp4\" type=\"video/mp4\">\n  <source src=\"clip.webm\" type=\"video/webm\">\n  Ваш браузер не поддерживает видео.\n</video>\n```\n\nАтрибут **width** задаёт ширину, **poster** показывает картинку до запуска. Атрибуты controls, autoplay, loop и muted работают так же, как у audio."}, {"t": "Форматы и тег source", "b": "Аудио: **MP3**, OGG, WAV. Видео: **MP4**, WebM, Ogg. Самые универсальные: MP3 и MP4.\n\nТег **source** позволяет предложить несколько файлов, а браузер выберет первый, который сможет воспроизвести. Атрибут **type** указывает формат. Текст внутри тега audio или video виден только в старых браузерах."}, {"t": "Пути к файлам и видео с YouTube", "b": "Если файл лежит в папке music, путь пишется так: **src=\"music/song.mp3\"**. Скелет страницы: html, внутри head и body.\n\nЧужое видео с YouTube вставляют тегом **iframe**.\n\n```\n<iframe src=\"https://www.youtube.com/embed/ИДЕНТИФИКАТОР\" allowfullscreen></iframe>\n```\n\nВ заданиях урока вы соберёте сайт композитора из файлов index, header, menu, main и footer и добавите на страницу его музыку."}], "quiz": [{"q": "Какой тег вставляет звук на веб-страницу?", "o": ["<sound>", "<audio>", "<music>", "<mp3>"], "a": 1}, {"q": "Какой тег вставляет видео?", "o": ["<movie>", "<media>", "<video>", "<film>"], "a": 2}, {"q": "Какой атрибут показывает кнопки управления плеером?", "o": ["play", "controls", "buttons", "panel"], "a": 1}, {"q": "Какой атрибут зацикливает воспроизведение?", "o": ["repeat", "again", "loop", "cycle"], "a": 2}, {"q": "Какой атрибут выключает звук у видео?", "o": ["mute", "silent", "muted", "nosound"], "a": 2}, {"q": "Для чего у video нужен атрибут poster?", "o": ["Задаёт картинку-обложку до запуска", "Задаёт громкость", "Включает субтитры", "Задаёт формат файла"], "a": 0}, {"q": "Зачем нужен тег source?", "o": ["Подписывает видео", "Предлагает браузеру несколько файлов разных форматов", "Добавляет ссылку на сайт", "Задаёт размер окна"], "a": 1}, {"q": "Какой из вариантов является аудиоформатом?", "o": [".html", ".css", ".docx", ".mp3"], "a": 3}, {"q": "Какой видеоформат поддерживается почти всеми браузерами?", "o": ["PSD", "EXE", "MP4", "ZIP"], "a": 2}, {"q": "Что увидит пользователь, если браузер не поддерживает тег audio?", "o": ["Ничего не покажется", "Текст, написанный между тегами", "Пустое окно браузера", "Ошибку сервера"], "a": 1}, {"q": "Чем вставляют на страницу ролик с YouTube?", "o": ["Тегом table", "Тегом br", "Тегом iframe с адресом embed", "Тегом hr"], "a": 2}, {"q": "Как записать путь к song.mp3 из папки music рядом с HTML-файлом?", "o": ["song.mp3/music", "music/song.mp3", "music-song.mp3", "/song.mp3/music/"], "a": 1}, {"q": "Что делает атрибут autoplay?", "o": ["Ставит на паузу", "Скрывает плеер", "Запускает воспроизведение автоматически", "Увеличивает громкость"], "a": 2}, {"q": "В какой части документа размещают тег video?", "o": ["В head", "В body", "В title", "Перед DOCTYPE"], "a": 1}, {"q": "Какой порядок тегов верен для скелета HTML-документа?", "o": ["body, head, html", "head, html, body", "html, body, head", "html, head, body"], "a": 3}], "tasks": [{"t": "Задание по технике безопасности (3 балла)", "b": "Выполните задание по ТБ на отдельном авторском сайте: [Открыть сайт ТБ](https://frolicking-eclair-ea305a.netlify.app)\n\nЗа каждый правильный ответ на вопрос вы получаете **3 балла**."}, {"t": "LearningApps: теги и функции (до 9 баллов)", "b": "Откройте сервис [LearningApps](https://learningapps.org/watch?v=pm6bj3btc26). Проанализировав новый материал, соедините картинки и их функции. За каждое верно выполненное задание до 9 баллов.\n\n**Задание 1 (8 баллов).** Перетащите карточку с тегом на подходящую карточку с описанием. Если ответ верный, карточки «прилипают» друг к другу и подсвечиваются зелёным.\n\n**Задание 2 (10 баллов).** Перетащите каждый тег в нужную колонку. В конце нажмите кнопку проверки (галочку в углу), чтобы увидеть ошибочно распределённые теги.\n\n**Задание 3 (9 баллов).** Расставьте карточки сверху вниз в строгом порядке, восстановив правильный скелет HTML-документа."}, {"t": "Основное задание №1: сайт композитора", "b": "Создайте новый сайт и назовите его «Имя композитора (Фамилия студента)». Выберите шаблон и подберите свои изображения и материалы о композиторе. Композитора берите из списка доступных: один студент, один композитор.\n\n**Шаг 1.** Создайте несколько файлов: index, footer, header, main, menu. Начните с index: добавьте фреймы (frame), задайте им размеры и расположение на странице.\n\n**Шаг 2.** В файле footer сделайте «подвал» сайта, в файле header сделайте шапку.\n\n**Шаг 3.** В файле menu.html создайте гиперссылки на другие части сайта.\n\n**Шаг 4.** В файле main опишите путь и жизнь композитора, добавьте портрет и аудиофайлы с его произведениями (тег audio)."}, {"t": "Основное задание №2: сайт с помощью ИИ", "b": "Создайте новый вариант сайта с помощью искусственного интеллекта, используя CSS и JavaScript.\n\nПлатформы: промт [Gemini](https://gemini.google.com), генерация сайта [Claude](https://claude.ai/), текст [ChatGPT](https://chatgpt.com/).\n\n**Шаг 1.** Загрузите свой файл main.html в строку промта и напишите запрос, например:\n\n```\nСоздай мне сайт на основе информации из этого файла, добавь анимации, сделай стили, используй CSS и JavaScript\n```\n\nДождитесь генерации и скачайте готовый сайт кнопкой экспорта в правом верхнем углу.\n\n**Шаг 2.** Откройте скачанный файл и найдите недочёты. Если они есть, в том же чате попросите ИИ переделать как нужно."}, {"t": "Дополнительные материалы", "b": "[Видеоурок на YouTube](https://www.youtube.com/watch?v=ae_7JsgWLLY)\n\n[Google-презентация как интерактивная доска](https://docs.google.com/presentation/d/1PUSGjzmsGZp4sRYA6vKk0I22s08PjVrxCuAm3AVoEl4/edit?usp=sharing)\n\n[Таблица самооценивания студента](https://docs.google.com/spreadsheets/d/1uk6l2yOgzATDRbqhbMQtAobp07WDZmCamsFQVv8jQaM/edit?gid=1469562070#gid=1469562070)\n\nБесплатные платформы ИИ: изображения [Gemini](https://gemini.google.com), презентации [Gamma](https://gamma.app), текст [ChatGPT](https://chatgpt.com/)."}, {"t": "Критерии оценивания", "b": "**«3» (50–69%, D- / C+).** Знают и соблюдают ТБ, отвечают на вопросы, активно участвуют на уроке, знают назначение программы, подбирают шаблон и свои материалы.\n\n**«4» (70–89%, B- / B+).** Используют генераторы ИИ, правильно формулируют запрос, самостоятельно находят ошибки во время работы.\n\n**«5» (90–100%, A- / A).** Добавили на сайт аудио и видео, настроили анимации, исправили свои ошибки при работе с программой."}], "self": [{"t": "Задание по технике безопасности", "m": 3}, {"t": "LearningApps: задание 1", "m": 8}, {"t": "LearningApps: задание 2", "m": 10}, {"t": "LearningApps: задание 3", "m": 9}, {"t": "Основное задание №1: сайт композитора", "m": 20}, {"t": "Основное задание №2: сайт с помощью ИИ", "m": 20}]};

function shrink(file,mx,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
